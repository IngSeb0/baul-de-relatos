:root { --fondo: #0C0A14; --panel: #1A1626; --tinta: #2A2320; --crema: #F6F0E2; --gris: #B8B0C8; --oro: #F2B84B; --ok: #7BE06A; --aviso: #FF6E5A; --acento: #F2B84B; --franja: 0px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--crema); font-family: Nunito, system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#marco { position: fixed; inset: 0 0 var(--franja) 0; display: flex; align-items: center; justify-content: center; gap: 48px; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
#franja { position: fixed; left: 0; right: 0; bottom: 0; height: var(--franja); } /* reservada para la etapa 2 (docs/04 sección 9); hoy vacía */
#escena { position: relative; flex: none; overflow: hidden; background: var(--fondo); }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; font-size: 48px; line-height: 1.25; }
.lado { display: none; max-width: 340px; }
@media (min-width: 1024px) {
  #escena { border: 6px solid var(--tinta); border-radius: 28px; box-shadow: 0 0 0 3px #3A3350, 0 30px 80px rgba(0,0,0,.6); }
  .lado { display: block; }
  .lado h1 { font: 400 40px/1.05 Bungee, sans-serif; margin: 0 0 12px; }
  .lado h1 span { color: var(--oro); }
  .lado p { color: var(--gris); font-size: 18px; margin: 8px 0; }
  .lado .web { font: 400 20px Bungee, sans-serif; color: var(--oro); }
}
#gira { display: none; position: fixed; inset: 0; z-index: 9; background: var(--fondo); align-items: center; justify-content: center; font: 400 28px Bungee, sans-serif; text-align: center; padding: 24px; }
@media (orientation: landscape) and (max-height: 480px) and (pointer: coarse) { #gira { display: flex; } }

/* ----- piezas de interfaz (unidades lógicas de 1080 × 1920) ----- */
#ui > * { position: absolute; }
.b { font: 400 56px/1 Bungee, sans-serif; color: var(--tinta); background: var(--oro); border: 8px solid var(--tinta); border-radius: 999px; padding: 34px 56px 30px; box-shadow: 0 10px 0 var(--tinta); cursor: pointer; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 20px; min-height: 144px; white-space: nowrap; }
.b:active, .b.pulsado { transform: translateY(6px); box-shadow: 0 4px 0 var(--tinta); }
.b:focus-visible, .ico:focus-visible, .celda:focus-visible, .nav button:focus-visible, .enlace:focus-visible, .toque:focus-visible { outline: 8px solid #fff; outline-offset: 6px; }
.b.sec { background: var(--panel); color: var(--crema); }
.b.mes { background: var(--acento); }
.b.chico { font-size: 44px; padding: 26px 40px 22px; min-height: 144px; }
.b[disabled] { opacity: .5; }
.b svg { width: 60px; height: 60px; flex: none; }
.b.sec svg { stroke: var(--crema); }
.centro { left: 50%; transform: translateX(-50%); }
.centro:active, .centro.pulsado { transform: translateX(-50%) translateY(6px); }
.fila { left: 60px; right: 60px; display: flex; gap: 28px; justify-content: center; }
.fila .b { flex: 1; padding-left: 20px; padding-right: 20px; }
.titulo { left: 40px; right: 40px; text-align: center; font: 400 96px/1.02 Bungee, sans-serif; text-transform: uppercase; color: var(--crema); -webkit-text-stroke: 14px var(--tinta); paint-order: stroke fill; text-shadow: 0 10px 0 var(--tinta); margin: 0; }
.titulo.med { font-size: 72px; } .titulo.peq { font-size: 56px; -webkit-text-stroke-width: 10px; }
.titulo .oro, .oro { color: var(--oro); } .acento { color: var(--acento); }
.txt { left: 70px; right: 70px; text-align: center; font-weight: 700; text-shadow: 0 3px 0 rgba(0,0,0,.6); }
p.txt { margin: 0; }
.sub { color: var(--gris); }
.enlace { background: none; border: 0; font: 700 48px Nunito, sans-serif; color: var(--gris); text-decoration: underline; cursor: pointer; padding: 24px 28px; min-height: 144px; }
.panel { background: var(--panel); border: 6px solid var(--tinta); border-radius: 24px; padding: 30px 36px; box-shadow: 0 10px 0 rgba(0,0,0,.35); }
.ico { width: 144px; height: 144px; border-radius: 50%; background: var(--panel); border: 6px solid var(--tinta); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 6px 0 var(--tinta); }
.ico svg { width: 76px; height: 76px; stroke: var(--crema); } .ico svg path[fill="currentColor"] { fill: var(--oro); }
.toque { background: none; border: 0; cursor: pointer; padding: 0; border-radius: 40px; }
.aparece { animation: aparece .28s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes aparece { from { opacity: 0; scale: .8; } to { opacity: 1; scale: 1; } }
.late { animation: late 1s ease-in-out infinite; } @keyframes late { 50% { scale: 1.05; } }

/* barra inferior */
.nav { left: 0; right: 0; bottom: 0; height: 190px; display: flex; background: rgba(18,15,28,.96); border-top: 6px solid var(--tinta); }
.nav button { flex: 1; background: none; border: 0; color: var(--gris); font: 400 34px Bungee, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-transform: uppercase; }
.nav svg { width: 72px; height: 72px; stroke: var(--gris); } .nav svg path[fill="currentColor"] { fill: #4A4360; }
.nav button.activo { color: var(--oro); } .nav button.activo svg { stroke: var(--tinta); } .nav button.activo svg path[fill="currentColor"] { fill: var(--oro); } .nav button.activo svg path[fill="none"] { stroke: var(--oro); }
.nav button { min-width: 0; font-size: 30px; }

/* estadísticas */
.stats { left: 90px; right: 90px; display: grid; gap: 18px; }
.stat { display: grid; grid-template-columns: 300px 1fr 110px; align-items: center; gap: 20px; font: 400 44px Bungee, sans-serif; }
.stat .pista { height: 44px; background: #0C0A14; border: 5px solid var(--tinta); border-radius: 22px; overflow: hidden; }
.stat .rell { height: 100%; width: 0; background: var(--acento); border-radius: 16px; transform-origin: left center; animation: llenar .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes llenar { from { transform: scaleX(0); } }
.stat .num { text-align: right; } .stat .ins { color: var(--oro); }

/* marcador */
.lista { left: 40px; right: 40px; display: grid; gap: 8px; }
.fm { display: grid; grid-template-columns: 64px 288px 1fr 170px; align-items: center; gap: 14px; height: 82px; padding: 0 18px; border-radius: 20px; font: 400 40px Bungee, sans-serif; background: rgba(26,22,38,.82); border: 5px solid transparent; }
.fm.mio { border-color: var(--oro); background: #2A2238; box-shadow: 0 0 40px rgba(242,184,75,.35); }
.fm canvas { width: 52px; height: 64px; } .fm .pista { height: 34px; background: #0C0A14; border-radius: 17px; overflow: hidden; }
.fm .rell { height: 100%; width: 0; border-radius: 17px; transition: width .8s cubic-bezier(.2,.8,.2,1); } .fm .pts { text-align: right; }
.fm.pulso { animation: late .5s 1; }

/* cuadrículas */
.grid3 { left: 50px; right: 50px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.celda { position: relative; background: rgba(26,22,38,.9); border: 8px solid #3A3350; border-radius: 26px; padding: 0 0 12px; cursor: pointer; color: var(--crema); font: 400 32px/1.1 Bungee, sans-serif; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; overflow: hidden; min-height: 150px; }
.celda canvas { width: 100%; aspect-ratio: 1; display: block; } .celda.vacia canvas { filter: brightness(0) drop-shadow(0 0 2px #5A5270); opacity: .7; }
.celda .rz { font-size: 28px; padding: 4px 14px; border-radius: 12px; color: #fff; margin-top: 4px; } .celda.vacia .rz { background: none; color: var(--gris); }
.celda .falta { position: absolute; top: 8px; right: 8px; background: var(--oro); color: var(--tinta); font-size: 24px; padding: 4px 12px; border-radius: 12px; }
.celda.uso { box-shadow: 0 0 0 6px var(--oro); }
.pest { left: 50px; right: 50px; display: flex; gap: 20px; } .pest .b { flex: 1; }
.album-grid { max-height: 1190px; overflow: auto; padding: 8px; touch-action: pan-y; }
.album-grid .celda { min-height: 0; }
.album-grid canvas { aspect-ratio: 300 / 220; }

/* hojas (menú, código, probabilidades, privacidad…) */
.velo { inset: 0; background: rgba(6,5,10,.82); z-index: 5; display: flex; align-items: flex-end; }
.hoja { position: relative; width: 100%; max-height: 1700px; background: var(--panel); border-top: 8px solid var(--tinta); border-radius: 48px 48px 0 0; padding: 50px 60px 70px; overflow-y: auto; animation: sube .25s ease-out both; -webkit-user-select: text; user-select: text; }
@keyframes sube { from { translate: 0 100%; } }
.hoja h2 { font: 400 64px/1.05 Bungee, sans-serif; margin: 0 150px 30px 0; text-transform: uppercase; color: var(--oro); }
.hoja h3 { font: 400 44px Bungee, sans-serif; margin: 34px 0 8px; color: var(--crema); text-transform: uppercase; }
.hoja p { margin: 0 0 14px; color: var(--crema); } .hoja .ico { position: absolute; right: 50px; top: 40px; }
.hoja .col { display: grid; gap: 26px; margin-top: 20px; } .hoja .b { width: 100%; }
.hoja table { width: 100%; border-collapse: collapse; font-size: 46px; } .hoja td, .hoja th { padding: 16px 10px; text-align: left; border-bottom: 3px solid #2E2842; } .hoja td:last-child, .hoja th:last-child { text-align: right; font-family: Bungee, sans-serif; }
.hoja .punto { display: inline-block; width: 36px; height: 36px; border-radius: 10px; margin-right: 18px; vertical-align: -4px; border: 4px solid var(--tinta); }

.ficha-escaparate .control-vuelo { position:absolute;bottom:14px;right:16px }
.vuelo-nido { z-index:1 }
.hoja .ficha-dragon { gap:16px;margin-top:0 }
.hoja .ficha-dragon p { margin:0;font-size:38px }
.hoja .ficha-nivel { color:var(--gris) }
.ficha-renta { padding:14px 20px;background:#100d1a;border-radius:18px }
.ficha-renta strong { display:block;color:var(--oro);font:400 46px/1.2 Bungee,sans-serif }
.hoja .ficha-aviso { color:var(--ok) }
.hoja .ficha-aviso:empty { display:none }
.hoja .ficha-historia { padding:12px 12px 0;font-size:36px }
.ficha-historia summary { cursor:pointer;color:var(--crema);min-height:94px;padding:18px 8px }
.album-renta { color:var(--oro);font:800 32px/1.1 Nunito,sans-serif;padding:10px 6px 4px;text-transform:none }
.video-premio { height:850px;width:100%;background:#0c0a14;border-radius:24px;object-fit:contain }
.centro-col progress { width:100%;height:42px;accent-color:var(--oro) }
.nido-huevos .b { font-size:38px;white-space:normal;text-align:center }
.cuenta-huevo { font-size:37px;line-height:1.08 }
.b.guia-equipo { left:170px;right:170px;min-height:57px;padding:5px 15px;border:3px solid #594633;border-radius:19px;font:800 35px/1 Nunito,sans-serif;text-transform:none;color:var(--oro);box-shadow:none }
.b.guia-equipo[hidden] { display:none }
.acc4 .b { white-space:normal;line-height:1.05;text-align:center }
.acc4 .b.flecha { font-size: 72px; line-height: 1; }
.hoja .b { white-space:normal;text-align:center }

/* pantalla completa: sin marco de escritorio, la escena ocupa todo el alto */
.lado { display: none !important; }
#escena { border: 0 !important; border-radius: 0 !important; box-shadow: 0 0 140px rgba(0,0,0,.7) !important; }
#marco { background: radial-gradient(70% 90% at 50% 40%, #2a1446 0%, #120c1e 55%, #0C0A14 100%); }

#pc { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); z-index: 8; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #3A3350; background: rgba(18,15,28,.85); color: #F6F0E2; display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
#pc svg { width: 22px; height: 22px; }
@media (min-aspect-ratio: 10/16) { #pc { display: flex; } }
